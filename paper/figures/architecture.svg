<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="100%" height="100%" fill="white"/>
<text x="450" y="24" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">End-to-end telemetry chain and trust boundary</text>
<rect x="20" y="80" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="82" y="106" text-anchor="middle" font-family="sans-serif" font-size="14">Virtual nodes</text>
<text x="82" y="128" text-anchor="middle" font-family="sans-serif" font-size="14">node-a/b/c</text>
<rect x="165" y="80" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="227" y="106" text-anchor="middle" font-family="sans-serif" font-size="14">Validity gates</text>
<text x="227" y="128" text-anchor="middle" font-family="sans-serif" font-size="14">+ Hampel</text>
<rect x="310" y="80" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="372" y="106" text-anchor="middle" font-family="sans-serif" font-size="14">Brown WQI</text>
<text x="372" y="128" text-anchor="middle" font-family="sans-serif" font-size="14">+ hysteresis</text>
<rect x="455" y="80" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="517" y="106" text-anchor="middle" font-family="sans-serif" font-size="14">SQLite buffer</text>
<text x="517" y="128" text-anchor="middle" font-family="sans-serif" font-size="14">WAL, 3 states</text>
<rect x="600" y="80" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="662" y="106" text-anchor="middle" font-family="sans-serif" font-size="14">MQTT/TLS</text>
<text x="662" y="128" text-anchor="middle" font-family="sans-serif" font-size="14">QoS 1, chunks</text>
<rect x="745" y="80" width="125" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="807" y="106" text-anchor="middle" font-family="sans-serif" font-size="14">ThingsBoard</text>
<text x="807" y="128" text-anchor="middle" font-family="sans-serif" font-size="14">rule engine</text>
<line x1="145" y1="115" x2="164" y2="115" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290" y1="115" x2="309" y2="115" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="435" y1="115" x2="454" y2="115" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="580" y1="115" x2="599" y2="115" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="725" y1="115" x2="744" y2="115" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0369a1"/></marker></defs>
<rect x="745" y="200" width="125" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="807" y="220" text-anchor="middle" font-family="sans-serif" font-size="13">Dashboard, alarms,</text>
<text x="807" y="239" text-anchor="middle" font-family="sans-serif" font-size="13">WQI rule chain</text>
<line x1="807" y1="150" x2="807" y2="200" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="200" width="420" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="230" y="221" text-anchor="middle" font-family="sans-serif" font-size="13">Local trust boundary: credentials and acquisition timestamps stay at the edge</text>
<text x="230" y="240" text-anchor="middle" font-family="sans-serif" font-size="12">Sampling continues while the cloud is unreachable</text>
</svg>
